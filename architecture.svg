<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>persMEM+ architecture</title>
<desc>Architecture showing Claude instances connecting through Caddy proxy to the persMEM+ server with Memory, AMQ, and Chorus Control subsystems backed by ChromaDB.</desc>
